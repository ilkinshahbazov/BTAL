name: GitHub Pages'e Yayınla

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
      - name: GitHub Pages'i hazırla
        uses: actions/configure-pages@v5
      - name: Site dosyalarını yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Siteyi yayınla
        id: deployment
        uses: actions/deploy-pages@v4
